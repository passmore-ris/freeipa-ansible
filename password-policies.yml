- name: Set password policies
  hosts: ipaservers
  become: true
  gather_facts: false
  vars_files:
    - vars/secrets.yml
    - vars/vars.yml
  tasks:

    - name: Ease password policies for pupils
      freeipa.ansible_freeipa.ipapwpolicy:
        ipaadmin_password: "{{ vault_ipaadmin_password }}"
        name: pupils
        minlength: 6
        dictcheck: false
        usercheck: true
        priority: 1
        state: present
