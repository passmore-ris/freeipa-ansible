[all:vars]
# ipa_server_ip = "192.168.122.61" # VM testing IP
ipa_server_ip = "192.168.88.212" # Real IP
ipa_server_fqdn = "ipa00.ipa.rischool.site"
domain = "ipa.rischool.site"
realm = "IPA.RISCHOOL.SITE"
ansible_user=root

[ipaservers]
"{{ ipa_server_fqdn }}" ansible_host="{{ ipa_server_ip }}" #ansible_user=root

[ipaservers:vars]
#ansible_user=root
ipaadmin_password="{{ vault_ipaadmin_password }}"
ipadm_password="{{ vault_ipadm_password }}"
ipaserver_domain="{{ domain }}"
ipaserver_realm="{{ realm }}"
ipaserver_setup_dns=yes
ipaserver_forwarders='["9.9.9.9", "149.112.112.112"]'

[ipareplicas]

[ipareplicas:vars]
ipaadmin_password="{{ vault_ipaadmin_password }}"
ipadm_password="{{ vault_ipadm_password }}"
ipareplica_domain="{{ domain }}"
ipaserver_realm="{{ realm }}"
ipareplica_setup_dns=yes
ipareplica_setup_ca=yes
ipareplica_setup_firewalld=yes
ipareplica_auto_reverse=yes
ipaclient_ntp_servers="{{ ipa_server_ip }}" # Sync with ipa00 master

